; flyoobe2.ini - optional extension rules for Flyoobe
; This file uses the same format as Flyoobe.ini and is merged automatically.
; A section with the same name replaces the section loaded before it.

[Enable Long Paths]
Category=System
Description=Allows long Win32 file paths for applications that declare long-path support.
Path=HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\FileSystem
ValueName=LongPathsEnabled
ValueType=DWORD
RecommendedValue=1
DefaultValue=<deletevalue>
DefaultSelected=false
RequiresAdmin=true
